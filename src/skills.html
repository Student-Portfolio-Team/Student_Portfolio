<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Skills — Student Portfolio</title>
  <link rel="stylesheet" href="../styles/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Showcase Hub</a>
      <nav class="nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="projects.html">Projects</a>
        <a href="skills.html" class="active">Skills</a>
        <a href="achievements.html">Achievements</a>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="toggle menu">☰</button>
    </div>
  </header>

  <main>
    <section class="panel container">
      <h1>Skills</h1>

      <div class="skill-item">
        <div class="skill-meta"><span>HTML & CSS</span><span>90%</span></div>
        <div class="progress"><div class="progress-bar" style="width:90%"></div></div>
      </div>

      <div class="skill-item">
        <div class="skill-meta"><span>JavaScript</span><span>75%</span></div>
        <div class="progress"><div class="progress-bar" style="width:75%"></div></div>
      </div>

      <div class="skill-item">
        <div class="skill-meta"><span>C++</span><span>70%</span></div>
        <div class="progress"><div class="progress-bar" style="width:70%"></div></div>
      </div>

      <div class="skill-item">
        <div class="skill-meta"><span>React</span><span>60%</span></div>
        <div class="progress"><div class="progress-bar" style="width:60%"></div></div>
      </div>

      <div class="skill-item">
        <div class="skill-meta"><span>MySQL (DBMS)</span><span>65%</span></div>
        <div class="progress"><div class="progress-bar" style="width:65%"></div></div>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2025 Student Portfolio — Built by Sudais Sarfraz</p>
    </div>
  </footer>

  <script>
    const toggle = document.getElementById('menuToggle');
    const nav = document.getElementById('mainNav');
    toggle.addEventListener('click', ()=> nav.classList.toggle('open'));
  </script>
</body>
</html>
